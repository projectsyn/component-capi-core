parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-espejote/master/lib/espejote.libsonnet
        output_path: vendor/lib/espejote.libsonnet

  capi_core:
    kubeconfig:
      serverURL: kubeconfig.${cluster:name}.example.com
      apiURL: api.${cluster:name}.example.com
      oidc:
        issuerURL: https://keycloak.example.com/auth/realms/example-com
        clientId: capi_${cluster:name}
      ingress:
        metadata:
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
        spec:
          tls:
            - hosts: ["${capi_core:kubeconfig:serverURL}"]
              secretName: user-kubeconfig-tls
