parameters:
  kapitan:
    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: capi-core/
      - input_paths:
          - ${_base_directory}/component/cluster-api.jsonnet
        input_type: jsonnet
        output_path: ${_base_directory}/manifests/cluster-api/
      - input_type: external
        output_path: .
        input_paths:
          - ${_kustomize_wrapper}
        env_vars:
          INPUT_DIR: ${_base_directory}/manifests/cluster-api/
        args:
          - \${compiled_target_dir}/capi-core/cluster-api/10_kustomize
  commodore:
    postprocess:
      filters:
        - type: jsonnet
          filter: postprocess/substitute_capi_variables.jsonnet
          path: capi-core/cluster-api/10_kustomize
